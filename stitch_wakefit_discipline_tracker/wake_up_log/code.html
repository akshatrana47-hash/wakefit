<style>
        body { background-color: #0D0F1A; }
        .bg-level-1 { background-color: #1C1F2E; }
        .border-tactical { border-color: #2D324A; border-width: 1px; }
        
        /* Time Picker Styling */
        .picker-container {
            height: 150px;
            overflow: hidden;
            position: relative;
            mask-image: linear-gradient(to bottom, transparent, black 30%, black 70%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 30%, black 70%, transparent);
        }
        .picker-column {
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            scrollbar-width: none; /* Firefox */
        }
        .picker-column::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
        }
        .picker-item {
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            scroll-snap-align: center;
            font-family: 'Geist', monospace;
            font-size: 24px;
            color: #bacac4; /* on-surface-variant */
            transition: color 0.2s, font-size 0.2s;
        }
        .picker-item.active {
            color: #46f1cf; /* primary */
            font-size: 32px;
            font-weight: 600;
        }
        .selection-overlay {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 50px;
            transform: translateY(-50%);
            border-top: 1px solid #2D324A;
            border-bottom: 1px solid #2D324A;
            pointer-events: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface antialiased flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="w-full sticky top-0 z-40 border-b border-outline-variant dark:border-outline-variant bg-surface dark:bg-surface transition-opacity duration-200">
<div class="flex justify-between items-center px-margin-mobile h-16 w-full">
<button aria-label="Go back" class="text-on-surface-variant hover:opacity-80 p-2 flex items-center justify-center rounded-full">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight text-center flex-1">Discipline</h1>
<div class="w-10"></div> <!-- Placeholder to balance header -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-margin-mobile py-lg pb-32">
<div class="mb-lg text-center">
<h2 class="font-headline-md text-headline-md text-on-surface">Log Your Wake-Up</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Record today's discipline.</p>
</div>
<!-- Large Time Display (Interactive Anchor) -->
<div class="bg-level-1 border-tactical rounded-xl p-lg flex flex-col items-center justify-center mb-lg relative overflow-hidden group cursor-pointer transition-colors hover:border-primary">
<div class="absolute inset-0 bg-primary opacity-0 group-active:opacity-5 transition-opacity"></div>
<div class="font-display-lg text-display-lg text-primary tracking-tighter" style="font-variant-numeric: tabular-nums;">
                06:42
            </div>
<div class="font-label-md text-label-md text-on-surface-variant mt-xs uppercase tracking-widest">
                AM
            </div>
</div>
<!-- Simulated iOS Time Picker -->
<div class="bg-surface border-tactical rounded-xl mb-lg relative">
<div class="selection-overlay"></div>
<div class="flex picker-container">
<!-- Hours Column -->
<div class="flex-1 picker-column" id="hours-picker">
<div class="picker-item">04</div>
<div class="picker-item">05</div>
<div class="picker-item active">06</div>
<div class="picker-item">07</div>
<div class="picker-item">08</div>
</div>
<!-- Separator -->
<div class="flex items-center justify-center font-display-lg text-display-lg text-on-surface-variant pb-2">
                    :
                </div>
<!-- Minutes Column -->
<div class="flex-1 picker-column" id="minutes-picker">
<div class="picker-item">40</div>
<div class="picker-item">41</div>
<div class="picker-item active">42</div>
<div class="picker-item">43</div>
<div class="picker-item">44</div>
</div>
<!-- AM/PM Column -->
<div class="flex-1 picker-column" id="ampm-picker">
<div class="picker-item"></div>
<div class="picker-item active">AM</div>
<div class="picker-item">PM</div>
<div class="picker-item"></div>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-md mb-xl">
<button class="w-full bg-primary text-[#000000] font-label-md text-label-md py-sm rounded-lg uppercase tracking-wider transition-transform active:scale-95 shadow-[0_0_15px_rgba(70,241,207,0.2)]">
                Save Entry
            </button>
<button class="w-full bg-transparent border border-primary text-primary font-label-md text-label-md py-sm rounded-lg uppercase tracking-wider transition-transform active:scale-95">
                Use Current Time
            </button>
</div>
<!-- History Section -->
<div>
<h3 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest mb-md border-b border-tactical pb-xs">Recent Logs</h3>
<div class="flex flex-col gap-sm">
<!-- History Item 1 -->
<div class="bg-level-1 border-tactical rounded-lg p-sm flex justify-between items-center">
<div class="flex items-center gap-sm">
<div class="w-8 h-8 rounded-full bg-primary/10 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[18px]">check</span>
</div>
<div>
<div class="font-label-md text-label-md text-on-surface">Yesterday</div>
<div class="font-label-sm text-label-sm text-on-surface-variant">Oct 26</div>
</div>
</div>
<div class="font-label-md text-label-md text-primary font-mono">05:30 AM</div>
</div>
<!-- History Item 2 -->
<div class="bg-level-1 border-tactical rounded-lg p-sm flex justify-between items-center">
<div class="flex items-center gap-sm">
<div class="w-8 h-8 rounded-full bg-primary/10 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[18px]">check</span>
</div>
<div>
<div class="font-label-md text-label-md text-on-surface">Friday</div>
<div class="font-label-sm text-label-sm text-on-surface-variant">Oct 25</div>
</div>
</div>
<div class="font-label-md text-label-md text-primary font-mono">06:00 AM</div>
</div>
<!-- History Item 3 -->
<div class="bg-level-1 border-tactical rounded-lg p-sm flex justify-between items-center">
<div class="flex items-center gap-sm">
<div class="w-8 h-8 rounded-full bg-on-surface-variant/10 flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant text-[18px]">close</span>
</div>
<div>
<div class="font-label-md text-label-md text-on-surface">Thursday</div>
<div class="font-label-sm text-label-sm text-on-surface-variant">Oct 24</div>
</div>
</div>
<div class="font-label-md text-label-md text-on-surface-variant font-mono line-through">08:15 AM</div>
</div>
</div>
</div>
</main>
<!-- BottomNavBar (Suppressed due to Task-Focused/Linear intent - "Log Your Wake-Up" is an action screen, not a top-level destination) -->
<!-- The user is in a focused journey to log time. Nav shell is intentionally omitted as per the Semantic Shell Mandate. -->
</body></html>
