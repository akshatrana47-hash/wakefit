            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(70, 241, 207, 0.7); }

<body class="font-body-md text-body-md antialiased min-h-screen flex flex-col relative overflow-hidden">
<!-- Background Context (Simulated Food Log underneath) -->
<div class="flex-1 opacity-40 blur-[2px] pointer-events-none p-margin-mobile">
<div class="h-16 flex items-center justify-between mb-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile">Food</h1>
</div>
<div class="space-y-md">
<div class="h-32 rounded-xl bg-surface-container border border-outline-variant p-md"></div>
<div class="h-24 rounded-xl bg-surface-container border border-outline-variant p-md"></div>
</div>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 modal-overlay z-40 flex flex-col justify-end">
<!-- Bottom Sheet -->
<div class="bottom-sheet rounded-t-3xl w-full max-w-2xl mx-auto flex flex-col pt-lg pb-xl px-margin-mobile transition-transform duration-300 ease-out translate-y-0 relative z-50">
<!-- Handle -->
<div class="w-12 h-1 bg-surface-variant rounded-full mx-auto mb-lg"></div>
<!-- Header -->
<div class="flex justify-between items-center mb-lg">
<h2 class="font-headline-md text-headline-md text-on-surface">Add Food Entry</h2>
<button aria-label="Close modal" class="w-10 h-10 rounded-full flex items-center justify-center bg-surface-variant text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
</div>
<!-- Content Area -->
<div class="flex-1 flex flex-col space-y-xl mb-xl">
<!-- Text Area Section -->
<div class="flex flex-col space-y-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="food-input">What did you eat?</label>
<textarea class="input-field rounded-xl p-md font-body-lg text-body-lg text-on-surface w-full h-32 resize-none placeholder:text-on-surface-variant/50" id="food-input" placeholder="e.g. 2 scrambled eggs with spinach and a black coffee...">2 scrambled eggs with spinach, half an avocado, and a black coffee.</textarea>
</div>
<!-- Dictation Section -->
<div class="flex flex-col items-center justify-center py-lg">
<button class="w-24 h-24 rounded-full bg-primary/10 border border-primary text-primary flex items-center justify-center mb-md relative mic-btn-recording group transition-all duration-300">
<span class="material-symbols-outlined text-[40px] z-10" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
<p class="font-label-md text-label-md text-primary animate-pulse">Listening...</p>
</div>
</div>
<!-- Footer Action -->
<div class="mt-auto">
<button class="w-full btn-primary rounded-xl h-14 font-headline-md text-[18px] font-semibold tracking-wide flex items-center justify-center space-x-2 transition-transform active:scale-[0.98]">
<span>Save Entry</span>
<span class="material-symbols-outlined">check</span>
</button>
</div>
</div>
</div>
<script>
        // Simple interaction simulation for demonstration
        document.addEventListener('DOMContentLoaded', () => {
            const closeBtn = document.querySelector('button[aria-label="Close modal"]');
            const bottomSheet = document.querySelector('.bottom-sheet');
            const overlay = document.querySelector('.modal-overlay');

            closeBtn.addEventListener('click', () => {
                bottomSheet.style.transform = 'translateY(100%)';
                overlay.style.opacity = '0';
                setTimeout(() => {
                    // In a real app, this would close the modal or navigate back
                    console.log('Modal closed');
                }, 300);
            });
        });
    </script>
