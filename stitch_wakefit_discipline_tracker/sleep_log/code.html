<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sleep Check-In</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@500;600&amp;display=swap" rel="stylesheet"/>
<!-- For 'Metropolis' placeholder, using a standard sans-serif that looks geometric if custom isn't loaded -->
<style>
        @font-face {
            font-family: 'metropolis';
            src: local('Inter'), local('sans-serif');
            font-weight: 700;
        }
        @font-face {
            font-family: 'metropolis';
            src: local('Inter'), local('sans-serif');
            font-weight: 800;
        }
        @font-face {
            font-family: 'geist';
            src: local('Geist Mono'), local('monospace');
        }
    </style>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-error": "#690005",
                      "surface-container": "#122131",
                      "on-background": "#d4e4fa",
                      "surface-variant": "#273647",
                      "on-secondary-container": "#b2b4c8",
                      "secondary-container": "#434657",
                      "secondary-fixed-dim": "#c3c5da",
                      "tertiary-fixed-dim": "#c5c5d5",
                      "error": "#ffb4ab",
                      "outline-variant": "#3b4a45",
                      "surface": "#051424",
                      "outline": "#84948f",
                      "inverse-primary": "#006b5a",
                      "secondary": "#c3c5da",
                      "on-primary-fixed-variant": "#005143",
                      "on-tertiary-fixed-variant": "#444653",
                      "on-secondary-fixed": "#181b2a",
                      "surface-container-low": "#0d1c2d",
                      "primary": "#46f1cf",
                      "tertiary-fixed": "#e1e1f2",
                      "surface-bright": "#2c3a4c",
                      "tertiary": "#d7d7e7",
                      "error-container": "#93000a",
                      "inverse-surface": "#d4e4fa",
                      "on-tertiary": "#2e303c",
                      "on-primary-container": "#005648",
                      "primary-container": "#00d4b4",
                      "tertiary-container": "#bbbbcb",
                      "on-primary-fixed": "#00201a",
                      "on-secondary-fixed-variant": "#434657",
                      "secondary-fixed": "#e0e1f6",
                      "surface-tint": "#27dfbe",
                      "on-secondary": "#2d303f",
                      "on-tertiary-container": "#494b58",
                      "on-error-container": "#ffdad6",
                      "on-primary": "#00382e",
                      "surface-container-high": "#1c2b3c",
                      "on-surface": "#d4e4fa",
                      "primary-fixed": "#55fcda",
                      "surface-container-lowest": "#010f1f",
                      "surface-container-highest": "#273647",
                      "primary-fixed-dim": "#27dfbe",
                      "background": "#051424",
                      "on-tertiary-fixed": "#191b26",
                      "surface-dim": "#051424",
                      "on-surface-variant": "#bacac4",
                      "inverse-on-surface": "#233143"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "margin-desktop": "64px",
                      "sm": "12px",
                      "margin-mobile": "20px",
                      "base": "8px",
                      "gutter": "16px",
                      "md": "16px",
                      "xs": "4px",
                      "xl": "40px",
                      "lg": "24px"
              },
              "fontFamily": {
                      "display-lg": ["metropolis"],
                      "body-lg": ["inter"],
                      "headline-lg-mobile": ["metropolis"],
                      "body-md": ["inter"],
                      "label-sm": ["geist"],
                      "label-md": ["geist"],
                      "headline-md": ["metropolis"],
                      "headline-lg": ["metropolis"]
              },
              "fontSize": {
                      "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                      "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                      "headline-lg-mobile": ["28px", { "lineHeight": "34px", "fontWeight": "700" }],
                      "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                      "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.08em", "fontWeight": "500" }],
                      "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                      "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                      "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }]
              }
            }
          }
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen text-on-surface font-body-md antialiased selection:bg-primary selection:text-on-primary">
<!-- TopAppBar JSON Component -->
<header class="bg-surface dark:bg-surface w-full sticky top-0 z-40 border-b border-outline-variant dark:border-outline-variant flex justify-between items-center px-margin-mobile h-16 w-full">
<!-- Leading Avatar -->
<button class="w-8 h-8 rounded-full bg-surface-variant flex items-center justify-center overflow-hidden border border-outline-variant hover:opacity-80 transition-opacity duration-200">
<span class="material-symbols-outlined text-on-surface-variant text-sm" data-icon="person">person</span>
</button>
<!-- Headline -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Discipline</h1>
<!-- Trailing Icon -->
<button class="w-8 h-8 flex items-center justify-center hover:opacity-80 transition-opacity duration-200">
<span class="material-symbols-outlined text-primary dark:text-primary" data-icon="settings">settings</span>
</button>
</header>
<!-- Main Canvas -->
<main class="px-margin-mobile py-lg max-w-2xl mx-auto flex flex-col gap-xl">
<!-- Header Section -->
<section class="flex flex-col gap-base">
<h2 class="font-headline-lg text-headline-lg text-on-surface uppercase tracking-tight">Sleep Check-In</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Did you sleep on time last night?</p>
</section>
<!-- Toggle Cards Area -->
<section class="grid grid-cols-1 md:grid-cols-2 gap-md" id="toggle-container">
<!-- Option: YES -->
<button class="group flex flex-col items-start gap-base p-md rounded-xl border border-primary bg-primary/10 text-left transition-all duration-200 focus:outline-none" id="btn-yes">
<div class="w-full flex justify-between items-center">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-sm text-label-sm text-primary uppercase">Logged</span>
</div>
<div>
<h3 class="font-headline-md text-headline-md text-primary">Yes</h3>
<p class="font-body-md text-body-md text-on-surface opacity-90 mt-xs">before 11:50 PM</p>
</div>
</button>
<!-- Option: NO -->
<button class="group flex flex-col items-start gap-base p-md rounded-xl border border-outline-variant bg-surface-variant/30 hover:border-error hover:bg-error/5 text-left transition-all duration-200 focus:outline-none" id="btn-no">
<div class="w-full flex justify-between items-center">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-error transition-colors text-3xl" data-icon="cancel">cancel</span>
<span class="font-label-sm text-label-sm text-transparent group-hover:text-error uppercase transition-colors">Missed</span>
</div>
<div>
<h3 class="font-headline-md text-headline-md text-on-surface group-hover:text-error transition-colors">No</h3>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">I stayed up late</p>
</div>
</button>
</section>
<!-- Notes Field -->
<section class="flex flex-col gap-xs mt-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest pl-xs" for="sleep-notes">Notes</label>
<textarea class="w-full bg-surface-container-highest border border-outline-variant rounded-lg p-md font-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all duration-200 resize-none placeholder:text-outline" id="sleep-notes" placeholder="Any disruptions? Caffeine late in the day?" rows="3"></textarea>
</section>
<!-- Save Action -->
<section class="mt-sm">
<button class="w-full bg-primary text-on-primary hover:bg-primary-fixed-dim transition-colors duration-200 rounded-xl py-sm font-label-md text-label-md uppercase tracking-wider h-14 flex items-center justify-center">
                Save Log
            </button>
</section>
<!-- 7-Day History Strip -->
<section class="flex flex-col gap-md pt-lg mt-md border-t border-surface-variant">
<div class="flex justify-between items-center w-full">
<h4 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">7-Day History</h4>
<span class="font-label-sm text-label-sm text-primary">85% Streak</span>
</div>
<div class="flex justify-between items-center w-full gap-xs">
<!-- Day -6: Success -->
<div class="flex flex-col items-center gap-xs">
<div class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center border border-primary">
<span class="material-symbols-outlined text-sm" data-icon="done" style="font-variation-settings: 'FILL' 1;">done</span>
</div>
</div>
<!-- Day -5: Success -->
<div class="flex flex-col items-center gap-xs">
<div class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center border border-primary">
<span class="material-symbols-outlined text-sm" data-icon="done" style="font-variation-settings: 'FILL' 1;">done</span>
</div>
</div>
<!-- Day -4: Failure -->
<div class="flex flex-col items-center gap-xs">
<div class="w-8 h-8 rounded-full bg-error text-on-error flex items-center justify-center border border-error">
<span class="material-symbols-outlined text-sm" data-icon="close" style="font-variation-settings: 'FILL' 1;">close</span>
</div>
</div>
<!-- Day -3: Success -->
<div class="flex flex-col items-center gap-xs">
<div class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center border border-primary">
<span class="material-symbols-outlined text-sm" data-icon="done" style="font-variation-settings: 'FILL' 1;">done</span>
</div>
</div>
<!-- Day -2: Success -->
<div class="flex flex-col items-center gap-xs">
<div class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center border border-primary">
<span class="material-symbols-outlined text-sm" data-icon="done" style="font-variation-settings: 'FILL' 1;">done</span>
</div>
</div>
<!-- Day -1: Failure -->
<div class="flex flex-col items-center gap-xs">
<div class="w-8 h-8 rounded-full bg-error text-on-error flex items-center justify-center border border-error">
<span class="material-symbols-outlined text-sm" data-icon="close" style="font-variation-settings: 'FILL' 1;">close</span>
</div>
</div>
<!-- Today: Active/Pending -->
<div class="flex flex-col items-center gap-xs">
<div class="w-8 h-8 rounded-full bg-transparent text-primary flex items-center justify-center border-2 border-primary border-dashed">
<span class="font-label-sm text-label-sm">T</span>
</div>
</div>
</div>
</section>
</main>
<script>
        // Simple Interaction Logic for the Toggles to demonstrate tactile feel
        const btnYes = document.getElementById('btn-yes');
        const btnNo = document.getElementById('btn-no');

        const stateYesActive = ['border-primary', 'bg-primary/10'];
        const stateYesInactive = ['border-outline-variant', 'bg-surface-variant/30'];
        
        const stateNoActive = ['border-error', 'bg-error/10'];
        const stateNoInactive = ['border-outline-variant', 'bg-surface-variant/30'];

        btnYes.addEventListener('click', () => {
            // Activate Yes
            btnYes.classList.add(...stateYesActive);
            btnYes.classList.remove(...stateYesInactive);
            btnYes.querySelector('span[data-icon="check_circle"]').style.fontVariationSettings = "'FILL' 1";
            btnYes.querySelector('h3').classList.add('text-primary');
            btnYes.querySelector('div > span:last-child').classList.replace('text-transparent', 'text-primary');
            
            // Deactivate No
            btnNo.classList.remove(...stateNoActive);
            btnNo.classList.add(...stateNoInactive);
            btnNo.querySelector('span[data-icon="cancel"]').style.fontVariationSettings = "'FILL' 0";
            btnNo.querySelector('h3').classList.remove('text-error');
            btnNo.querySelector('div > span:last-child').classList.replace('text-error', 'text-transparent');
        });

        btnNo.addEventListener('click', () => {
            // Activate No
            btnNo.classList.add(...stateNoActive);
            btnNo.classList.remove(...stateNoInactive);
            btnNo.querySelector('span[data-icon="cancel"]').style.fontVariationSettings = "'FILL' 1";
            btnNo.querySelector('h3').classList.add('text-error');
            btnNo.querySelector('div > span:last-child').classList.replace('text-transparent', 'text-error');
            
            // Deactivate Yes
            btnYes.classList.remove(...stateYesActive);
            btnYes.classList.add(...stateYesInactive);
            btnYes.querySelector('span[data-icon="check_circle"]').style.fontVariationSettings = "'FILL' 0";
            btnYes.querySelector('h3').classList.remove('text-primary');
            btnYes.querySelector('div > span:last-child').classList.replace('text-primary', 'text-transparent');
        });
    </script>
</body></html>
